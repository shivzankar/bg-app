apiVersion: apps/v1
kind: Deployment
metadata: { name: app-__COLOR__ }
spec:
  replicas: 2
  selector: { matchLabels: { app: bg-app, version: __COLOR__ } }
  template:
    metadata: { labels: { app: bg-app, version: __COLOR__ } }
    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        env:
        - { name: APP_COLOR, value: "__COLOR__" }
        - { name: BUILD, value: "__TAG__" }
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: v1
kind: Service
metadata: { name: app-__COLOR__-svc }
spec:
  selector: { app: bg-app, version: __COLOR__ }
  ports: [{ port: 80, targetPort: 5000 }]
